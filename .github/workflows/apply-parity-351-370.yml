name: Apply parity 351-370 interactions

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/apply-parity-351-370.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-parity-351-370
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply parity patch
        run: node scripts/patch-parity-351-370.mjs
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm run test:unit
      - name: Latest stable audit
        run: npm run audit:latest
      - name: Parity audit
        run: npm run audit:parity
      - name: Project check
        run: npm run check
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/types/index.ts src/world/OpenableRules.ts src/world/ContainerRules.ts src/world/FurnaceRules.ts src/world/BedRules.ts src/world/SignRules.ts src/engine/Game.ts tests/parity-351-370.test.ts
          git diff --cached --check
          git commit -m "feat: deepen Java 26.3 core interaction parity"
          git push origin HEAD:master
