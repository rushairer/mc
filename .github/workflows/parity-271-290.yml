name: Parity 271-290 Runtime Wiring

on:
  push:
    branches: [master]
    paths:
      - 'scripts/.parity-271-290-trigger'

permissions:
  contents: write

jobs:
  wire-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python3 scripts/.parity-271-290.py
      - run: python3 scripts/.parity-271-290-fix-brewing-ui.py
      - run: npm ci
      - run: npm run audit:latest
      - run: npm run audit:parity
      - run: npm run check
      - name: Commit runtime parity
        run: |
          git config user.name "Aben"
          git config user.email "5195693+rushairer@users.noreply.github.com"
          git add src/server/GameServer.ts src/ui/BrewingUI.tsx
          git commit -m "fix: wire Java 26.3 command combat pearl and brewing parity"
          git push origin HEAD:master
