name: Parity 91-110 Finalize

on:
  push:
    branches: [master]
    paths:
      - 'scripts/.parity-91-110-trigger'

permissions:
  contents: write

jobs:
  finalize-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Close remaining authority gaps
        run: |
          node scripts/parity-91-110-finalize.mjs
          node scripts/fix-parity-91-110-authority-test.mjs
          npm run audit:parity
          npm run check
          git config user.name "Aben"
          git config user.email "5195693+rushairer@users.noreply.github.com"
          git add src/server/GameServer.ts tests/server-authority-contract.test.ts
          git commit -m "fix: close server respawn and inventory authority gaps"
          git push origin HEAD:master
