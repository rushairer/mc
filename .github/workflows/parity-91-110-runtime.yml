name: Parity 91-110 Runtime Wiring

on:
  push:
    branches: [master]
    paths:
      - 'scripts/.parity-91-110-trigger'

permissions:
  contents: write

jobs:
  wire-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Wire combat and projectile authority
        run: |
          node scripts/parity-91-110-runtime.mjs combat
          npm run audit:parity
          npm run check
          git config user.name "Aben"
          git config user.email "5195693+rushairer@users.noreply.github.com"
          git add src/server/GameServer.ts src/server/NetworkClient.ts src/systems/MobSystem.ts src/engine/Game.ts
          git commit -m "fix: wire server combat and projectile authority"
      - name: Enforce world action validation
        run: |
          node scripts/parity-91-110-runtime.mjs world
          npm run audit:parity
          npm run check
          git add src/server/GameServer.ts
          git commit -m "fix: enforce server world action validation"
      - name: Push staged parity work
        run: git push origin HEAD:master
