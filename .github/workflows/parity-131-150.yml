name: Parity 131-150 Hardening

on:
  push:
    branches: [master]
    paths:
      - 'scripts/.parity-131-150-trigger'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Harden authoritative chest and hopper UI
        run: |
          node scripts/parity-131-138-container-ui.mjs
          npm run audit:parity
          npm run check
          git config user.name "Aben"
          git config user.email "5195693+rushairer@users.noreply.github.com"
          git add src/engine/Game.ts src/App.tsx src/ui/ChestUI.tsx src/ui/HopperUI.tsx
          git commit -m "fix: make network containers server-controlled"
          git push origin HEAD:master
