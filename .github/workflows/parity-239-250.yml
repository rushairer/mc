name: Apply parity 239-250

on:
  push:
    branches: [master]
    paths:
      - scripts/patch-parity-239-250.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/patch-parity-239-250.mjs
      - run: npm run check
      - name: Commit parity batch
        run: |
          git config user.name "Aben"
          git config user.email "5195693+rushairer@users.noreply.github.com"
          git add src/entities/Mob.ts src/systems/MobSystem.ts src/engine/Game.ts src/world/WildernessBoundChanges26_3.ts src/world/WildernessBoundGameplay26_3.ts tests/parity-211-230.test.ts tests/parity-239-250.test.ts
          git commit -m "feat: align 26.3 runtime behavior parity 239-250"
          git push origin HEAD:master
