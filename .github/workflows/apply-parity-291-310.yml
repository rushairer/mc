name: Apply parity 291-310 item fundamentals

# Validation trigger revision: project-tsc-command
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/apply-parity-291-310.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-parity-291-310
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply item fundamentals patch
        run: node scripts/patch-parity-291-310-v3.mjs
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm run test:unit
      - name: Latest stable target audit
        run: npm run audit:latest
      - name: Parity audit
        run: npm run audit:parity
      - name: Type check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Commit verified parity changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/items/ItemPresentation.ts src/i18n.tsx src/visual/VisualResolver.ts src/world/WildernessBound26_3.ts src/world/BlockPlacement.ts src/engine/Game.ts tests/parity-291-310.test.ts
          git diff --cached --check
          git commit -m "feat: align item fundamentals with Java 26.3"
          git push origin HEAD:master
