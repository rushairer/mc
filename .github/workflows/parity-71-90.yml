name: One-shot parity 71-90 wiring

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message == 'chore: execute parity 71-90 wiring' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply parity runtime wiring
        run: python3 scripts/apply-parity-71-90.py
      - run: npm ci
      - run: npm run audit:parity
      - run: npm run check
      - name: Commit parity runtime wiring
        run: |
          git config user.name "Aben"
          git config user.email "5195693+rushairer@users.noreply.github.com"
          git add src/systems/EnchantSystem.ts src/engine/Game.ts
          git commit -m "fix: wire parity rounds 71-90 into runtime"
          git push origin master
