name: Apply parity 291-300

on:
  push:
    branches:
      - parity-291-300-staging
    paths:
      - scripts/patch-parity-291-300.mjs
      - .github/workflows/parity-291-300.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/patch-parity-291-300.mjs
      - run: npm run check
      - name: Commit parity batch
        run: |
          git config user.name "Aben"
          git config user.email "5195693+rushairer@users.noreply.github.com"
          git add src tests
          if git diff --cached --quiet; then
            echo "No parity changes to commit"
            exit 0
          fi
          git commit -m "feat: wire 26.3 chorus teleport and safe destinations"
          git push origin HEAD:parity-291-300-staging
