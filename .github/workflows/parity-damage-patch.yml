name: One-shot damage parity patch

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message == 'chore: execute damage parity patch' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply damage parity patch
        run: python3 scripts/apply-damage-parity.py
      - run: npm ci
      - run: npm run audit:parity
      - run: npm run check
      - name: Commit damage parity wiring
        run: |
          git config user.name "Aben"
          git config user.email "5195693+rushairer@users.noreply.github.com"
          git add src/player/Inventory.ts src/engine/Game.ts
          git commit -m "fix: wire Java armor toughness and protection pipeline"
          git push origin master
