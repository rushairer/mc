name: Apply parity 291-310 item fundamentals

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/apply-parity-291-310.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-parity-291-310
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply item fundamentals patch
        run: |
          set +e
          node scripts/patch-parity-291-310-v3.mjs > parity-291-310-run.log 2>&1
          status=$?
          cat parity-291-310-run.log
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add parity-291-310-run.log
            git commit -m "chore: capture parity 291-310 v3 failure"
            git push origin HEAD:master
            exit "$status"
          fi
          rm parity-291-310-run.log

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Latest stable target audit
        run: npm run audit:latest

      - name: Parity audit
        run: npm run audit:parity

      - name: Type check
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Commit verified parity changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/items/ItemPresentation.ts src/i18n.tsx src/visual/VisualResolver.ts src/world/WildernessBound26_3.ts src/world/BlockPlacement.ts src/engine/Game.ts tests/parity-291-310.test.ts
          git diff --cached --check
          git commit -m "feat: align item fundamentals with Java 26.3"
          git push origin HEAD:master
