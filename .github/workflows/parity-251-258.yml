name: Apply parity 251-258

on:
  push:
    branches: [master]
    paths:
      - scripts/patch-parity-251-258.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/patch-parity-251-258.mjs
      - run: npm run check
      - name: Commit parity batch
        run: |
          git config user.name "Aben"
          git config user.email "5195693+rushairer@users.noreply.github.com"
          git add src tests
          git commit -m "feat: preserve 26.3 suspicious stew effects"
          git push origin HEAD:master
