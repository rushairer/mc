name: Apply parity 391-410 furnace rules

on:
  push:
    branches: [master]
    paths:
      - 'src/world/FurnaceRules.ts'
      - 'scripts/patch-parity-391-410-game.mjs'
      - 'scripts/patch-parity-391-410-ui.mjs'
      - 'scripts/patch-parity-391-410-quickmove.mjs'
      - 'tests/parity-391-410.test.ts'
      - '.github/workflows/apply-parity-391-410.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply runtime and UI patches
        run: |
          node scripts/patch-parity-391-410-game.mjs
          node scripts/patch-parity-391-410-ui.mjs
          node scripts/patch-parity-391-410-quickmove.mjs

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Latest stable audit
        run: npm run audit:latest

      - name: Parity audit
        run: npm run audit:parity

      - name: Project check
        run: npm run check

      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "feat: align furnace interactions with Java 26.3 parity 391-410"
          git push origin HEAD:master
