name: Apply parity 331-350 interactions

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/apply-parity-331-350.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-parity-331-350
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply parity patch
        run: node scripts/patch-parity-331-350.mjs
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm run test:unit
      - name: Latest stable audit
        run: npm run audit:latest
      - name: Parity audit
        run: npm run audit:parity
      - name: Project check
        run: npm run check
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/world/SignRules.ts src/world/BehaviorIds.ts src/world/BlockState.ts src/world/BlockPlacement.ts src/visual/VisualResolver.ts src/engine/TextureAtlas.ts src/engine/Game.ts src/App.tsx tests/parity-291-310.test.ts tests/parity-331-350.test.ts
          git diff --cached --check
          git commit -m "feat: deepen Java 26.3 block interaction parity"
          git push origin HEAD:master
