name: Apply parity 311-330 item fundamentals

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/apply-parity-311-330.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-parity-311-330
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply parity patch
        run: node scripts/patch-parity-311-330.mjs
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm run test:unit
      - name: Latest stable audit
        run: npm run audit:latest
      - name: Parity audit
        run: npm run audit:parity
      - name: Project check
        run: npm run check
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/items/InventoryTransferRules.ts src/items/ItemUseRules.ts src/items/ItemStackRules.ts src/items/ItemRegistry.ts src/player/Inventory.ts src/engine/Game.ts tests/parity-311-330.test.ts
          git diff --cached --check
          git commit -m "feat: harden item fundamentals phase 2"
          git push origin HEAD:master
