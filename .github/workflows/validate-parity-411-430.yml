name: Validate parity 411-430

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/validate-parity-411-430.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout parity 411-430 milestone
        uses: actions/checkout@v4
        with:
          ref: 63a5fbcb231f7be9a7abf14c8de7951d50038c44

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Latest stable audit
        run: npm run audit:latest

      - name: Parity audit
        run: npm run audit:parity

      - name: Project check
        run: npm run check
