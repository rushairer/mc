name: One-shot combat parity patch

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: run combat parity patch script'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply combat parity patch
        run: python3 scripts/apply-combat-parity.py
      - run: npm ci
      - run: npm run audit:parity
      - run: npm run check
      - name: Commit combat parity wiring
        run: |
          git config user.name "Aben"
          git config user.email "5195693+rushairer@users.noreply.github.com"
          git add src/items/ItemRegistry.ts src/systems/EnchantSystem.ts src/engine/Game.ts
          git commit -m "fix: wire Java 1.20.1 combat attributes"
          git push origin master
