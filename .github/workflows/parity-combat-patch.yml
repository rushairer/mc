name: One-shot combat parity patch

on:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: rerun combat parity patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Wire combat parity rules
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once('src/items/ItemRegistry.ts', "import { rollBlockLoot } from '../world/LootSystem';\n", "import { rollBlockLoot } from '../world/LootSystem';\nimport { getMeleeAttackDamage } from './CombatAttributes';\n")
          replace_once('src/items/ItemRegistry.ts', "        damage = toolType === 'sword' || toolType === 'spear' ? stats.damage + 3 : (toolType === 'axe' ? stats.damage + 2 : stats.damage);", "        damage = toolType === 'spear'\n          ? stats.damage + 3\n          : getMeleeAttackDamage(toolType, toolMaterial);")

          replace_once('src/systems/EnchantSystem.ts', "    return level > 0 ? 1 + level * 0.5 : 0;", "    return level > 0 ? 0.5 + level * 0.5 : 0;")
          replace_once('src/systems/EnchantSystem.ts', "    return level > 0 ? 1 + 0.25 * level : 1;", "    return level > 0 ? 1.25 + 0.25 * level : 1;")

          replace_once('src/engine/Game.ts', "import type { WorldTickPayload, WorldTickType } from '../world/WorldTick';\n", "import type { WorldTickPayload, WorldTickType } from '../world/WorldTick';\nimport { getAttackCooldownSeconds } from '../items/CombatAttributes';\nimport { calculateMeleeDamage, isChargedMeleeAttack } from '../systems/CombatRules';\n")
          replace_once('src/engine/Game.ts', "    const fullAttackDamage = baseAttackDamage + EnchantSystem.getSharpnessBonus(\n      EnchantSystem.getLevel(selectedItemStack, 'sharpness')\n    ) + PotionEffects.getMeleeDamageModifier(\n      this.potionEffects.getLevel('strength'),\n      this.potionEffects.getLevel('weakness'),\n    );\n    const attackCooldownDuration = this.getAttackCooldownDuration(selectedItemId);\n    const attackCooldownProgress = this.getAttackCooldownProgress();\n    const attackDamage = fullAttackDamage * this.getAttackCooldownDamageScale();\n    const isCriticalMelee = attackCooldownProgress >= 0.9 && this.isCriticalMeleeAttack();\n    const meleeAttackDamage = isCriticalMelee ? attackDamage * 1.5 : attackDamage;", "    const attributeAttackDamage = baseAttackDamage + PotionEffects.getMeleeDamageModifier(\n      this.potionEffects.getLevel('strength'),\n      this.potionEffects.getLevel('weakness'),\n    );\n    const enchantmentAttackDamage = EnchantSystem.getSharpnessBonus(\n      EnchantSystem.getLevel(selectedItemStack, 'sharpness')\n    );\n    const attackCooldownDuration = this.getAttackCooldownDuration(selectedItemId);\n    const attackCooldownProgress = this.getAttackCooldownProgress();\n    const isCriticalMelee = isChargedMeleeAttack(attackCooldownProgress) && this.isCriticalMeleeAttack();\n    const meleeAttackDamage = calculateMeleeDamage({\n      baseAttributeDamage: attributeAttackDamage,\n      enchantmentDamage: enchantmentAttackDamage,\n      cooldownProgress: attackCooldownProgress,\n      critical: isCriticalMelee,\n    });")

          old_cooldown = "  private getAttackCooldownDuration(itemId: number): number {\n    const itemDef = ItemRegistry.get(itemId);\n    if (!itemDef || !ItemRegistry.isTool(itemId)) return 0.4;\n\n    switch (itemDef.toolType) {\n      case 'axe':\n        return 1.0;\n      case 'pickaxe':\n      case 'shovel':\n      case 'hoe':\n        return 0.8;\n      case 'spear':\n        return 0.9;\n      case 'sword':\n        return 0.625;\n      default:\n        return 0.625;\n    }\n  }"
          new_cooldown = "  private getAttackCooldownDuration(itemId: number): number {\n    const itemDef = ItemRegistry.get(itemId);\n    return getAttackCooldownSeconds(itemDef?.toolType, itemDef?.toolMaterial);\n  }"
          replace_once('src/engine/Game.ts', old_cooldown, new_cooldown)
          PY

      - run: npm ci
      - run: npm run audit:parity
      - run: npm run check

      - name: Commit combat parity wiring
        run: |
          git config user.name "Aben"
          git config user.email "5195693+rushairer@users.noreply.github.com"
          git add src/items/ItemRegistry.ts src/systems/EnchantSystem.ts src/engine/Game.ts
          git commit -m "fix: wire Java 1.20.1 combat attributes"
          git push origin master
