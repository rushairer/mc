name: Apply parity 371-390 interactions

on:
  push:
    branches: [master]
    paths:
      - 'scripts/patch-parity-371-390.mjs'
      - 'scripts/patch-parity-371-390-v2.mjs'
      - '.github/workflows/apply-parity-371-390.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply parity patch
        run: |
          node scripts/patch-parity-371-390.mjs
          node scripts/patch-parity-371-390-v2.mjs

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Latest stable audit
        run: npm run audit:latest

      - name: Parity audit
        run: npm run audit:parity

      - name: Project check
        run: npm run check

      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "feat: deepen Java 26.3 interaction parity 371-390"
          git push origin HEAD:master
