name: One-shot runtime parity patch

on:
  push:
    branches: [ master ]
    paths:
      - .github/workflows/parity-runtime-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Patch Game runtime wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/engine/Game.ts')
          text = path.read_text()
          old_fluid = "          setBlockMeta: (x, y, z, metadata, markDirty) => this.chunks.setBlockMeta(x, y, z, metadata, markDirty),\n        });"
          new_fluid = "          setBlockMeta: (x, y, z, metadata, markDirty) => this.chunks.setBlockMeta(x, y, z, metadata, markDirty),\n          dimension: tick.dimension,\n        });"
          if text.count(old_fluid) != 1:
              raise SystemExit(f'expected one fluid access block, found {text.count(old_fluid)}')
          text = text.replace(old_fluid, new_fluid, 1)
          old_respawn = "    this.player.hunger = 20;\n    this.player.saturation = 20;\n    this.player.flying = false;"
          new_respawn = "    this.player.hunger = 20;\n    this.player.saturation = 5;\n    this.player.flying = false;"
          if text.count(old_respawn) != 1:
              raise SystemExit(f'expected one respawn hunger block, found {text.count(old_respawn)}')
          text = text.replace(old_respawn, new_respawn, 1)
          path.write_text(text)
          PY

      - run: npm ci
      - run: npm run audit:parity
      - run: npm run check

      - name: Commit runtime wiring
        run: |
          git config user.name "Aben"
          git config user.email "5195693+rushairer@users.noreply.github.com"
          git add src/engine/Game.ts
          git commit -m "fix: wire dimension-aware fluids and respawn saturation"
          git push origin HEAD:master
